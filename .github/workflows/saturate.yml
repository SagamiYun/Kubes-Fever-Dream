name: Kubes-Fever-Dream-Saturator
on:
  schedule:
    - cron: '0 0,6,12,18 * * *' # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  saturate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add Hallucination
        run: |
          python hallucinate.py
          git config --global user.name "Kubes Bot"
          git config --global user.email "87216735+SagamiYun@users.noreply.github.com"
          git add diary.md
          git commit -m "Auto-Hallucination: $(date -u)"
          git push
